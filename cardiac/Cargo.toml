[package]
name = "cardiac"
version = "0.2.3"
edition = "2021"
# the [lints] table
rust-version = "1.74"
description = "Rust on CARDIAC, the classic 1968 cardboard computer from Bell Labs."
license = "MIT"
repository.workspace = true
homepage.workspace = true
# the repository's README, which both crates share
readme = "../README.md"
keywords = ["cardiac", "compiler", "retrocomputing", "education"]
categories = ["compilers", "emulators"]

[lints.rust]
# set by the CARDIAC compiler when it builds this crate; never by cargo
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(cardiac)"] }
