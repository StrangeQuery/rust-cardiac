[package]
name = "cargo-cardiac"
version = "0.2.4"
edition = "2021"
# the compiler reads the MIR text that rustc 1.97 prints, so that is the rustc it needs, to build and to run
rust-version = "1.97"
description = "Cargo subcommands for building, running and debugging Rust on CARDIAC."
license = "MIT"
repository.workspace = true
homepage.workspace = true
# a command: its documentation is the project's page, not an API on docs.rs
documentation = "https://lab.strangequery.com/rust-cardiac/"
readme = "CARGO-CARDIAC.md"
keywords = ["cardiac", "compiler", "cargo-subcommand", "retrocomputing", "mir"]
categories = ["compilers", "development-tools::cargo-plugins", "emulators"]
# examples/ is a package of its own (the example programs), not cargo examples of this one
autoexamples = false
# what crates.io gets: the command, its source and how to build it
include = ["/src", "/build.rs", "/CARGO-CARDIAC.md", "/LICENSE"]

[[bin]]
name = "cargo-cardiac"
path = "src/main.rs"

[profile.release]
debug = false

# dev builds the examples optimized, as embedded Rust does; debuginfo, debug assertions and incremental change the MIR
[profile.dev.package.examples]
opt-level = 2
overflow-checks = false
debug-assertions = false
debug = false
incremental = false

[profile.dev.package.cardiac]
opt-level = 2
overflow-checks = false
debug-assertions = false
debug = false
incremental = false

# collatz counts on its overflow checks to stop where a card overflows: on in dev and in release
[profile.dev.package.collatz]
opt-level = 2
overflow-checks = true
debug-assertions = false
debug = false
incremental = false

[profile.release.package.collatz]
overflow-checks = true

# checked: the dev build with debug assertions on, so an assume() is checked on CARDIAC too
[profile.checked]
inherits = "dev"

[profile.checked.package.examples]
debug-assertions = true

[profile.checked.package.cardiac]
debug-assertions = true

[dependencies]
serde_json = "1"
# CARDIAC itself: the emulator, decks and listings; and with `tools`, burn, ekg and carc, which run, debug and asm are
heartburn = { version = "0.1.3", features = ["tools"] }

[workspace]
members = ["cardiac", "examples", "examples/collatz"]
# the compiler's test package for programs of two crates, and the feature tests: built only by their scripts
exclude = ["tests/programs/crates", "tests/features"]

# the repository's address and the project's page, for both published crates
[workspace.package]
repository = "https://github.com/StrangeQuery/rust-cardiac"
homepage = "https://lab.strangequery.com/rust-cardiac/"
